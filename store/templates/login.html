{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Fashion Cart</title>

    <link rel="stylesheet"
          href="{% static 'css/login.css' %}">

</head>
<body>

<h1>
    <a href="{% url 'home' %}">
        Fashion Cart
    </a>
</h1>


<main class="login-container">

    <h2>Login</h2>


    <!-- ERROR MESSAGE -->

    {% if error %}
        <div class="login-error">
            {{ error }}
        </div>
    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="off"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="new-password"
                required
            >

        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</main>


</body>

</html>
